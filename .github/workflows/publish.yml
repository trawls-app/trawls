name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: trawls-linux-x86_64
            binary: target/release/trawls-gpui
          - name: macOS aarch64
            os: macos-latest
            artifact: trawls-macos-aarch64
            binary: target/release/trawls-gpui
          - name: Windows x86_64
            os: windows-latest
            artifact: trawls-windows-x86_64
            binary: target/release/trawls-gpui.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libwayland-dev libxkbcommon-x11-dev libfontconfig-dev libssl-dev libgit2-dev cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
